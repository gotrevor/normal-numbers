name = "NormalNumbers"
version = "0.1.0"
keywords = ["math", "number-theory", "normal-numbers", "equidistribution"]
srcDir = "src"
defaultTargets = ["NormalNumbers"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "NormalNumbers"

[[lean_lib]]
name = "Comparator"
srcDir = ".."
globs = ["Comparator.+"]

[[lean_lib]]
name = "PNTPort"
globs = ["PNTPort.+"]


# Alexeev's plby/lean-proofs (src/latest), via a fork bumped to our mathlib v4.33.1
# (gotrevor/lean-proofs, branch pnt-as-dependency: requires real PNT+, no embedded copy).  Erdős 67b: unit-circle log-Elliott + MRT.
[[require]]
name = "lean-proofs-latest"
git = "https://github.com/gotrevor/lean-proofs.git"
rev = "8b7630fef471b6ac8685f1830f8b0288e5b9f4f1"
subDir = "src/latest"
