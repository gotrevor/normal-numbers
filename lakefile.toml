name = "NormalNumbers"
version = "0.1.0"
keywords = ["math", "number-theory", "normal-numbers", "equidistribution"]
srcDir = "src"
defaultTargets = ["NormalNumbers"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "NormalNumbers"

[[lean_lib]]
name = "Comparator"
srcDir = ".."
globs = ["Comparator.+"]


# Alexeev's plby/lean-proofs (src/latest), via a fork bumped to our mathlib v4.33.1
# (gotrevor/lean-proofs, branch erdos49-pnt-as-dependency: real PNT+, no embedded copies).  Erdős 67b: unit-circle log-Elliott + MRT.
[[require]]
name = "lean-proofs-latest"
git = "https://github.com/gotrevor/lean-proofs.git"
rev = "e8d5bef2d0d2ab32e8c6f16587d540564edfd832"
subDir = "src/latest"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "55270df807213fc3584523d09e0311d7dc073ff5"
