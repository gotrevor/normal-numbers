name = "NormalNumbers"
version = "0.1.0"
keywords = ["math", "number-theory", "normal-numbers", "equidistribution"]
srcDir = "src"
defaultTargets = ["NormalNumbers"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "NormalNumbers"

[[lean_lib]]
name = "Comparator"
srcDir = ".."
globs = ["Comparator.+"]

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "55270df807213fc3584523d09e0311d7dc073ff5"
