name: Comparator

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-24.04
    env:
      LANDRUN_REV: 5e9a0d15d6009cdaf27133bf2d59d29e7018cc47
      NANODA_REV: f58f2f6d535e189a40fcb02ede8eb95f97a92d37
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Read Lean verifier pins from the project
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          packages = {p["name"]: p for p in json.loads(Path("lake-manifest.json").read_text())["packages"]}
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for variable, package in [("LEAN4EXPORT_REV", "lean4export"), ("COMPARATOR_REV", "Comparator")]:
                  print(f"{variable}={packages[package]['rev']}", file=env)
              print(f"VERIFIER_LEAN_TOOLCHAIN={Path('lean-toolchain').read_text().strip()}", file=env)
          PY

      - name: Cache pinned verifier binaries
        id: cache-bins
        uses: actions/cache@v6
        with:
          path: ~/verifier-bin
          key: verifier-bin-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ env.LANDRUN_REV }}-${{ env.NANODA_REV }}

      # Build separately: this project and several dependencies also use the
      # Comparator namespace for challenge modules.
      - name: Build landrun, lean4export, nanoda, and comparator
        if: steps.cache-bins.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/verifier-bin ~/verifier-src
          cd ~/verifier-src
          git clone https://github.com/Zouuup/landrun.git
          (cd landrun && git checkout "$LANDRUN_REV" && go build -o ~/verifier-bin/landrun ./cmd/landrun)
          git clone https://github.com/ammkrn/nanoda_lib.git
          (cd nanoda_lib && git checkout "$NANODA_REV" && cargo build --release && cp target/release/nanoda_bin ~/verifier-bin/)
          git clone https://github.com/leanprover/lean4export.git
          (cd lean4export && git checkout "$LEAN4EXPORT_REV" && elan run "$VERIFIER_LEAN_TOOLCHAIN" lake build && cp .lake/build/bin/lean4export ~/verifier-bin/)
          git clone https://github.com/leanprover/comparator.git
          (cd comparator && git checkout "$COMPARATOR_REV" && elan run "$VERIFIER_LEAN_TOOLCHAIN" lake build comparator && cp .lake/build/bin/comparator ~/verifier-bin/)

      - name: Build project and comparator modules
        run: |
          lake exe cache get
          lake build NormalNumbers
          lake build Comparator

      - name: Verify every comparator result with Lean and nanoda
        run: |
          set -uo pipefail
          export PATH="$HOME/verifier-bin:$PATH"
          fail=0
          shopt -s nullglob
          configs=(Comparator/*/config.json)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "::error::no comparator configs found"; exit 1
          fi
          for cfg in "${configs[@]}"; do
            if ! lake env comparator "$cfg"; then
              echo "::error::comparator failed for $cfg"
              fail=1
            fi
          done
          exit $fail
